<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DnD Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya:ital,wght@0,400;0,600;1,400&family=Alegreya+Sans:wght@400;500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Reenie+Beanie&display=swap" rel="stylesheet">
<style>
/* A candlelit archive: deep slate-blue pages, brass rules and type-coded ribbons. Sidebar filters + card shelf; one-column on phones. */
:root {
  --bg: #12151b;
  --panel: #1a1e26;
  --panel-2: #222733;
  --line: #2f3542;
  --text: #e7e1d3;
  --muted: #9b968a;
  --brass: #d3a957;
  --brass-dim: #8f733d;
  --land: #3a4636;
  --land-hi: #8a8a6a;
  --sea: #172230;
  --bad: #e07a6a;
  --c-creature: #e0734f;
  --c-biology: #8fbf6e;
  --c-location: #6fa9d4;
  --c-faction: #b394e0;
  --c-magic: #5cc4b4;
  --c-history: #d8b36e;
  --c-general: #a5a196;
  --c-item: #f0c75e;
  --c-spell: #b9a2ff;
  --c-handout: #cdb894;
  --sb-paper: #f3e9d2;
  --sb-ink: #2a2118;
  --sb-red: #7a1414;
  --guide-gold: #b88f45;
  --guide-grey: #666666;
  --parch: #e8d6ad;
  --parch-ink: #3d2917;
  --unique: #ff9a3c;
  --divine: #fff1c4;
  --display: "Cinzel", "Trajan Pro", Georgia, serif;
  --body: "Alegreya", Georgia, "Times New Roman", serif;
  --ui: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-family: var(--ui); font-size: 16px; line-height: 1.5; min-height: 100%; }
body.modal-open { overflow: hidden; }
a { color: var(--brass); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(1.6rem, 3vw, 2.3rem); letter-spacing: .02em; line-height: 1.15; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.spacer { flex: 1; }
code { background: var(--panel-2); padding: 0 .3em; border-radius: 3px; font-size: .85em; }

/* header */
.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.topin { max-width: 1240px; margin: 0 auto; padding: 10px 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 700; font-size: 1.15rem; letter-spacing: .08em; color: var(--text); white-space: nowrap; }
.brand b { color: var(--brass); font-weight: 700; }
.brand:hover { text-decoration: none; }
.navwrap { display: flex; align-items: center; gap: 2px; min-width: 0; }
.nav { display: flex; gap: 2px; flex-wrap: wrap; }
.nav a, .navmore > summary { color: var(--muted); padding: 6px 8px; border-radius: 6px; font-weight: 500; white-space: nowrap; transition: color .12s, background .12s; }
.nav a:hover, .navmore > summary:hover { color: var(--text); text-decoration: none; background: var(--panel); }
.nav a.on, .navmore.on > summary { color: var(--text); background: var(--panel-2); box-shadow: inset 0 -2px 0 var(--brass); }
.navmore { position: relative; }
.navmore > summary { list-style: none; cursor: pointer; user-select: none; display: inline-flex; gap: 4px; align-items: center; }
.navmore > summary::-webkit-details-marker { display: none; }
.navmore[open] > summary { color: var(--text); background: var(--panel); }
.nmpop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 190px; display: grid; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 14px 40px rgba(0,0,0,.5); }
.nmpop a, .nmpop button { display: block; text-align: left; padding: 8px 12px; border-radius: 6px; color: var(--text); font: 500 .95rem var(--ui); background: none; border: 0; cursor: pointer; }
.nmpop a:hover, .nmpop button:hover { background: var(--panel-2); text-decoration: none; }
.nmpop a.on { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--brass); }
.nmpop .nmexport { border-top: 1px solid var(--line); border-radius: 0 0 6px 6px; margin-top: 4px; padding-top: 10px; }
.topsearch { flex: 1 1 140px; min-width: 120px; max-width: 280px; margin-left: auto; }
.topsearch input { padding-top: 7px; padding-bottom: 7px; }
.topin .searchtog { display: none; }
.iconbtn { padding: 7px 10px; line-height: 0; }
.topnew { white-space: nowrap; }
input[type=search], input[type=text], input[type=password], .enced input[type=number], .enced input:not([type]), .holdsopts input[type=number], .qcform input[type=number], .itresrow input[type=number], .sbhpctl input[type=number], .sbsprow input[type=number], .mrow input[type=number], .vform input[type=number], .usepanel input[type=number], .vllrow input[type=number], .vcondadd input[type=number], .vturns input[type=number], .vhpbox input[type=number], select, textarea {
  width: 100%; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px;
}
textarea { font-family: var(--body); font-size: 1.05rem; line-height: 1.55; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--brass-dim); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--brass) 25%, transparent); }
.btn { display: inline-flex; align-items: center; gap: 6px; font: 600 .95rem var(--ui); color: #1b1408; background: var(--brass); border: 1px solid var(--brass); border-radius: 7px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
.btn:hover { filter: brightness(1.08); text-decoration: none; }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--brass-dim); }
.btn.danger { background: transparent; color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, transparent); }
.btn.small { padding: 4px 10px; font-size: .85rem; }

main { max-width: 1240px; margin: 0 auto; padding: 24px 20px 80px; }
.banner { padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 18px; background: var(--panel); }
.banner.bad { border-color: color-mix(in srgb, var(--bad) 50%, transparent); }
.empty { padding: 48px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; }
.empty .btn { margin-top: 8px; }
.note { border-left: 3px solid var(--brass-dim); padding: 6px 12px; background: var(--panel); color: var(--muted); border-radius: 0 6px 6px 0; }

/* type colours */
.t-creature { --tc: var(--c-creature); } .t-biology { --tc: var(--c-biology); } .t-location { --tc: var(--c-location); }
.t-faction { --tc: var(--c-faction); } .t-item { --tc: var(--c-item); } .t-spell { --tc: var(--c-spell); } .t-handout { --tc: var(--c-handout); } .t-magic { --tc: var(--c-magic); } .t-history { --tc: var(--c-history); } .t-general { --tc: var(--c-general); } .t-subclass { --tc: #d08a4a; } .t-race { --tc: #5fae9b; } .t-class { --tc: #c9a227; } .t-feat { --tc: #b07ad6; }
.pill { display: inline-block; font: 700 .7rem var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--tc, var(--brass)); border: 1px solid color-mix(in srgb, var(--tc, var(--brass)) 45%, transparent); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }

/* tags */
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { display: inline-flex; align-items: center; gap: 4px; font: 500 .85rem var(--ui); color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 9px; cursor: pointer; }
a.tag:hover { border-color: var(--brass-dim); text-decoration: none; }
.tag.on { border-color: var(--brass); background: color-mix(in srgb, var(--brass) 16%, var(--panel-2)); }
.tag.loose { border-style: dashed; }
.tag.mini { font-size: .75rem; padding: 0 7px; cursor: default; color: var(--muted); }
.tag.feat { text-transform: capitalize; }

/* library */
.lib { display: grid; grid-template-columns: 260px 1fr; gap: 28px; align-items: start; }
.filters { position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow: auto; }
.filters summary { font-family: var(--display); font-weight: 700; cursor: pointer; display: none; }
.fgroup { margin-bottom: 22px; }
.fgroup h3 { font: 700 .75rem var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.fgroup h3 small { text-transform: none; letter-spacing: 0; font-weight: 400; }
.chips { display: flex; flex-direction: column; gap: 3px; }
.fchip, .ttag { display: flex; justify-content: space-between; align-items: center; width: 100%; font: 500 .95rem var(--ui); color: var(--text); background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 4px 8px; cursor: pointer; text-align: left; }
.fchip { border-left: 3px solid var(--tc); }
.fchip:hover, .ttag:hover { background: var(--panel); }
.fchip.on, .ttag.on { background: var(--panel-2); border-color: var(--brass-dim); }
.fchip span, .ttag span { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree ul { padding-left: 14px; border-left: 1px solid var(--line); margin-left: 8px; }
.libhead { display: grid; gap: 6px; margin-bottom: 18px; }
.libhead p { margin: 0; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.libhead .search { max-width: 460px; }
/* Library: search + Tags menu + type strip */
.libv .libhead { gap: 12px; margin-bottom: 18px; }
.lhrow { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.lhrow h1 { margin: 0; }
.libtools .search { max-width: 420px; }
.libtools .filterpop > summary { display: inline-flex; align-items: center; gap: 6px; }
.libtools .filterpop > summary.has { border-color: var(--brass); color: var(--text); }
.filterpop > summary .cnt { display: inline-grid; place-items: center; min-width: 1.4em; height: 1.4em; padding: 0 4px; border-radius: 999px; background: var(--brass); color: #1a1408; font: 700 .72rem var(--ui); }
.filterpop > summary .caret { font-size: .7em; opacity: .7; transition: transform .15s; }
.filterpop[open] > summary .caret { transform: rotate(180deg); }
.typebar { display: flex; flex-wrap: wrap; gap: 6px; }
.tchip { display: inline-flex; align-items: center; gap: 7px; font: 500 .9rem var(--ui); color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px 5px 10px; cursor: pointer; white-space: nowrap; transition: border-color .12s, background .12s; }
.tchip i { width: 8px; height: 8px; border-radius: 50%; background: var(--tc); flex: none; }
.tchip span { color: var(--muted); font-size: .78rem; font-variant-numeric: tabular-nums; }
.tchip:hover { border-color: color-mix(in srgb, var(--tc) 60%, var(--line)); }
.tchip.on { background: color-mix(in srgb, var(--tc) 22%, var(--panel-2)); border-color: var(--tc); }
.tchip.on span { color: var(--text); }
.activetags { margin: 0; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tpfoot { display: none; justify-content: flex-end; position: sticky; bottom: -12px; margin: 0 -12px -12px; padding: 10px 12px; background: var(--panel); border-top: 1px solid var(--line); }
@media (max-width: 700px) {
  .tpfoot { display: flex; }
  .btools.libtools { flex-wrap: nowrap; gap: 8px; }
  .btools.libtools .search { flex: 1 1 auto; min-width: 0; }
  .btools.libtools > .btn.small { flex: none; padding: 6px 10px; }
  .libtools .fclab { display: none; }
  .typebar { flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 4px; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 24px), transparent); }
  .typebar::-webkit-scrollbar { display: none; }
  .libv .libhead { gap: 10px; margin-bottom: 14px; }
  .lhrow h1 { font-size: 1.7rem; }
  .banner.import { padding: 8px 12px; gap: 8px; font-size: .9rem; }
  .banner.import > div { min-width: 0; flex-basis: 100%; }
  .banner.import .btn { padding: 5px 12px; font-size: .88rem; }
}
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.card { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px 14px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; color: var(--text); position: relative; overflow: hidden; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--tc); }
.card:hover { border-color: var(--brass-dim); text-decoration: none; }
.card h2 { font-family: var(--display); font-size: 1.1rem; font-weight: 700; }
.card p { margin: 0; font-family: var(--body); color: var(--muted); font-size: 1rem; flex: 1; }
.cardtop { display: flex; justify-content: space-between; gap: 8px; align-items: center; }

/* entry */
.entry { max-width: 820px; }
.crumbs { margin-bottom: 14px; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.ehead { display: grid; gap: 10px; padding-bottom: 18px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.ehead .pill { justify-self: start; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.prose { font-family: var(--body); font-size: 1.12rem; line-height: 1.65; max-width: 68ch; }
.prose p { margin: 0 0 .9em; }
.prose h3, .prose h4, .prose h5 { font-family: var(--display); margin: 1.2em 0 .4em; }
.prose h3 { font-size: 1.35rem; } .prose h4 { font-size: 1.15rem; } .prose h5 { font-size: 1rem; }
.prose blockquote { margin: 0 0 1em; padding-left: 14px; border-left: 3px solid var(--brass-dim); font-style: italic; color: var(--muted); }
.prose ul, .prose ol { margin: 0 0 1em; padding-left: 1.3em; }
.prose.main { margin-bottom: 8px; }
.wiki { border-bottom: 1px dotted var(--brass-dim); }
.wiki.missing { color: var(--muted); border-bottom-style: dashed; }
.sect { font-family: var(--display); font-size: 1.3rem; margin: 34px 0 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.rel { margin-bottom: 18px; }
.rel h3 { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; font-weight: 400; }
.relitem { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; margin-bottom: 8px; }
.relitem summary { cursor: pointer; display: flex; gap: 10px; align-items: center; font-family: var(--display); font-weight: 700; }
.relitem .prose { margin-top: 10px; font-size: 1.05rem; }
.fellows { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 4px 0 0; }
.flink { display: inline-block; padding: 2px 10px; border: 1px solid var(--line); border-radius: 6px; margin: 0 4px 4px 0; }
.towncard { display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; padding: 10px 14px; background: color-mix(in srgb, var(--c-location) 9%, var(--panel)); border: 1px solid color-mix(in srgb, var(--c-location) 30%, transparent); border-radius: 8px; margin-bottom: 18px; color: var(--text); }
.towncard:hover { text-decoration: none; border-color: var(--c-location); }
.towncard .go { margin-left: auto; color: var(--c-location); }

/* tags page */
.narrow { max-width: 760px; }
.narrow > p { max-width: 65ch; }
.newtag { display: grid; grid-template-columns: auto 1fr auto 1fr auto; gap: 8px; align-items: center; margin: 18px 0; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.newtag label { font-weight: 500; color: var(--muted); }
.tagtree, .tagtree ul { list-style: none; margin: 0; padding: 0; }
.tagtree ul { margin-left: 18px; border-left: 1px solid var(--line); padding-left: 10px; }
.trow { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); flex-wrap: wrap; }

/* world */
.mapwrap { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--sea); }
.mapwrap svg { display: block; width: 100%; height: auto; }
.mapwrap.small { max-width: 520px; }
.sea { fill: var(--sea); }
#land { image-rendering: auto; opacity: .95; }
.dot { stroke: #10131a; stroke-width: .6; cursor: pointer; }
.dot.cap { stroke: var(--text); stroke-width: 1.2; }
.dot.dim { opacity: .14; }
.dot.focus { stroke: #fff; stroke-width: 2.5; }
.dot:hover { stroke: #fff; stroke-width: 1.5; }
.mark { fill: none; stroke: var(--brass); stroke-width: 1.2; opacity: .8; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 18px; }
.lg { display: inline-flex; align-items: center; gap: 6px; font: 500 .85rem var(--ui); color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
.lg i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.lg span { color: var(--muted); font-variant-numeric: tabular-nums; }
.lg.on { border-color: var(--brass); }
.wfilters { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; margin-bottom: 8px; }
.wfilters label span { display: block; font: 700 .7rem var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; }
table.towns { width: 100%; border-collapse: collapse; font-size: .95rem; }
.towns th { text-align: left; font: 700 .72rem var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; background: var(--panel); position: sticky; top: 0; }
.towns td { padding: 7px 12px; border-top: 1px solid var(--line); white-space: nowrap; }
.towns tr:hover td { background: var(--panel); cursor: pointer; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.markers { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
.markers details { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.markers summary { cursor: pointer; font-weight: 600; }
.markers ul { padding-left: 1.1em; margin: 8px 0 0; font-size: .92rem; }
.importbox { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.importbox .btn { cursor: pointer; }
.towngrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; margin: 0 0 18px; }
.facts dt { font: 700 .7rem var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 0; font-weight: 500; }
.sub { font-family: var(--display); font-size: 1.05rem; margin: 6px 0 8px; }
.prod { list-style: none; padding: 0; margin: 0 0 6px; display: grid; gap: 5px; }
.prod li { display: grid; grid-template-columns: 130px 1fr 44px; gap: 10px; align-items: center; font-size: .95rem; }
.prod .bar { height: 7px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.prod .bar i { display: block; height: 100%; background: var(--brass); border-radius: 4px; }
.prod .num { color: var(--muted); }
.hint { margin-top: 28px; }

/* backup */
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 16px 0 28px; }
.lbl { display: block; font-weight: 600; margin-bottom: 6px; }
#restore { font-family: ui-monospace, monospace; font-size: .85rem; margin-bottom: 10px; }

/* modal */
#modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; }
#modal[hidden] { display: none; }
.mback { position: absolute; inset: 0; background: rgba(5, 7, 10, .7); }
.mbox { position: relative; width: min(760px, 100%); max-height: calc(100% - 20px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.mbox h2 { font-family: var(--display); font-size: 1.35rem; margin-bottom: 16px; }
.mbox form { display: grid; gap: 14px; }
.mbox label > span { display: block; font-weight: 600; margin-bottom: 4px; }
.mbox textarea, .mbox input, .mbox select { background: var(--bg); }
.frow { display: flex; gap: 12px; flex-wrap: wrap; }
.frow .grow { flex: 1; min-width: 220px; }
.tagin { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; }
.tagin #ed-tagchips { display: contents; }
.tagin input { border: 0; flex: 1; min-width: 140px; padding: 4px; background: transparent; box-shadow: none; }

/* stat block: the classic printed look, on parchment */
.statblock { background: var(--sb-paper); color: var(--sb-ink); font-family: var(--body); font-size: 1rem; line-height: 1.4; padding: 14px 16px 16px; border-radius: 4px; box-shadow: 0 0 0 2px #c9ad6a, 0 6px 24px rgba(0,0,0,.35); border-top: 5px solid #9c6c2a; border-bottom: 5px solid #9c6c2a; margin: 0 0 18px; max-width: 470px; }
.statblock p { margin: 0 0 3px; }
.statblock .sbname { font-family: var(--display); color: var(--sb-red); font-size: 1.5rem; letter-spacing: .02em; font-variant: small-caps; }
.statblock .sbsub { font-style: italic; margin-bottom: 4px; }
.statblock .taper { height: 4px; margin: 8px 0; background: linear-gradient(90deg, var(--sb-red), color-mix(in srgb, var(--sb-red) 0%, transparent)); clip-path: polygon(0 0, 100% 50%, 0 100%); }
.statblock .sbred b { color: var(--sb-red); }
.statblock .abil { display: grid; grid-template-columns: repeat(6, 1fr); text-align: center; color: var(--sb-red); gap: 4px; }
.statblock .abil b { display: block; font-family: var(--ui); font-size: .85rem; }
.statblock .abil span { color: var(--sb-ink); font-variant-numeric: tabular-nums; font-size: .95rem; }
.statblock .sbfeat h2, .statblock .sbfeat h3 { font-family: var(--display); color: var(--sb-red); font-size: 1.15rem; font-variant: small-caps; border-bottom: 1px solid var(--sb-red); margin: 12px 0 6px; padding-bottom: 1px; }
.statblock .sbfeat p { margin: 0 0 7px; }
.statblock .sbfeat strong em { color: var(--sb-ink); }
.statblock .sbfeat ul { margin: 0 0 7px; padding-left: 1.2em; }
.statblock .sbfeat a { color: var(--sb-red); }
.sbgrid { display: grid; grid-template-columns: minmax(300px, 470px) minmax(0, 1fr); gap: 28px; align-items: start; }
.sbgrid.solo { grid-template-columns: minmax(0, 470px); }
.entry.wide { max-width: 1120px; }
.cr { font: 700 .75rem var(--ui); color: var(--c-creature); margin-left: auto; }
.imeta { font-style: italic; font-family: var(--body); color: var(--muted) !important; font-size: .95rem !important; flex: 0 !important; }
.imeta.big { font-size: 1.1rem !important; display: flex; gap: 14px; flex-wrap: wrap; align-items: baseline; margin: 0 0 12px; }
.holder { font-style: normal; font-family: var(--ui); font-size: .9rem; }
.stub { font-style: italic; opacity: .7; }
.source { margin: -6px 0 14px; }
.rar { font: 700 .7rem var(--ui); letter-spacing: .08em; text-transform: uppercase; margin-left: auto; color: var(--brass); }
.r-common { color: #b7b2a6; } .r-uncommon { color: #7fc46b; } .r-rare { color: #6fa9e6; } .r-very-rare { color: #b98ae6; } .r-legendary { color: #f0a04a; } .r-artifact { color: #e8735e; }
.chiprow { display: flex; flex-wrap: wrap; gap: 6px; }
.typefields { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px 12px; display: grid; gap: 10px; }
.typefields[hidden] { display: none; }
.typefields legend { font-weight: 700; padding: 0 6px; }
.sbformgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); gap: 16px; align-items: start; margin-top: 8px; }
@media (max-width: 860px) { .sbformgrid { grid-template-columns: 1fr; } }
.sbformleft { display: grid; gap: 12px; margin-top: 8px; }
.sbhpspeed { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; align-items: start; }
.sbspeed > .btn { justify-self: start; width: auto; }
.sbprevwrap { margin: 10px 0; } .sbprevwrap summary { cursor: pointer; margin-bottom: 6px; }
.sbhp, .sbspeed { display: grid; gap: 6px; }
.sbhpctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sbhpctl input, .sbsprow input[type=number] { width: 5em !important; flex: 0 0 auto; }
.sbhpctl select, .sbsprow select { width: auto !important; flex: 0 1 auto; max-width: 100%; }
.sbprev b { color: var(--text); }
#sbm-speeds { display: grid; gap: 6px; }
.sbsprow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sbsprow [hidden] { display: none !important; }
.sbsprow .sbsp-text { flex: 1 1 14em; }
.sbpreview .statblock.mini { margin: 0; font-size: .92rem; max-width: 520px; }
.sbmeta label[hidden] { display: none; }
.sbdetails { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px 18px; margin: 12px 0 6px; }
.sbdet { display: grid; gap: 6px; align-content: start; }
.sbdet > .btn { justify-self: start; width: auto; }
.sbdrows { display: grid; gap: 6px; } .sbdrows:empty { display: none; }
.sbsavegrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 10px; }
.sbsave-v, .sbd-bonus { font-variant-numeric: tabular-nums; color: var(--brass); }
.sbdrow .sbd-text { flex: 1 1 10em; min-width: 8em; }
.sbdrow .sbd-v { max-width: 15em; }
.sbdnote:empty { display: none; }
.sbgridform { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.abilform { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.abilform input { text-align: center; }
.banner.import { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; border-color: var(--brass-dim); background: color-mix(in srgb, var(--brass) 8%, var(--panel)); }
.banner.import > div { flex: 1; min-width: 240px; }
.sorth { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; }
.sorth:hover, .sorth.on { color: var(--text); }
.sorth:focus-visible { outline: 2px solid var(--brass); }
.sorth .arr { font-size: .7rem; color: var(--brass); min-width: .8em; }
th.num .sorth { justify-content: flex-end; }
/* books */
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.bookcard { display: flex; gap: 14px; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; color: var(--text); }
.bookcard:hover { border-color: var(--brass-dim); text-decoration: none; }
.bookcard .spine { flex: 0 0 10px; border-radius: 3px; background: linear-gradient(180deg, var(--brass), var(--brass-dim)); }
.bookcard.st-in-progress .spine { background: linear-gradient(180deg, var(--c-location), #3f6f93); }
.bookcard.st-planned .spine { background: repeating-linear-gradient(180deg, var(--line) 0 6px, transparent 6px 10px); }
.srcpill { display: inline-block; vertical-align: middle; font: 700 .68rem var(--ui); letter-spacing: .1em; text-transform: uppercase; color: #0f2a16; background: #6fcf7f; border-radius: 99px; padding: 2px 9px; }
h2.sect .srcpill { margin-left: 4px; } h2.sect .muted { text-transform: none; letter-spacing: 0; font-weight: 500; }
.bookcard.source { border-color: color-mix(in srgb, #6fcf7f 35%, var(--line)); }
.bookcard.source .spine { background: linear-gradient(180deg, #6fcf7f, #2f7d43); }
.bookcard.source h3 .srcpill { font-size: .6rem; padding: 1px 7px; margin-left: 4px; }
.bookcard h3 { font-family: var(--display); font-size: 1.1rem; margin-bottom: 4px; }
.bookcard p { margin: 0 0 6px; font-family: var(--body); color: var(--muted); }
.bookview { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 32px; align-items: start; }
.toc { position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow: auto; font-size: .92rem; }
.toc h3 { font: 700 .72rem var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }
.toc ol { list-style: none; padding: 0; margin: 0; }
.toc li.l2 { padding-left: 14px; font-size: .88rem; }
.toc button { all: unset; cursor: pointer; display: block; padding: 3px 0; color: var(--muted); }
.toc button:hover { color: var(--text); }
.toc button:focus-visible { outline: 2px solid var(--brass); }
.book { max-width: 820px; }
.bookprose h2 { font-family: var(--display); font-size: 1.6rem; margin: 1.6em 0 .5em; padding-bottom: 4px; border-bottom: 1px solid var(--line); scroll-margin-top: 80px; }
.bookprose h3, .bookprose h4, .bookprose h5 { scroll-margin-top: 80px; }
.hlink { font: 500 .8rem var(--ui); margin-left: 8px; vertical-align: middle; }
.tablewrap.doc { margin: 0 0 1em; font-family: var(--ui); font-size: .92rem; }
.tablewrap.doc table { border-collapse: collapse; width: 100%; }
.tablewrap.doc td { border: 1px solid var(--line); padding: 6px 8px; vertical-align: top; }
.prose hr { border: 0; border-top: 1px solid var(--line); margin: 1.4em 0; }
.prose del { opacity: .7; }


/* AND / OR toggle */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; margin-bottom: 4px; }
.seg button { font: 500 .85rem var(--ui); color: var(--muted); background: transparent; border: 0; padding: 5px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--panel-2); color: var(--text); box-shadow: inset 0 -2px 0 var(--brass); }
.seghint { margin: 0 0 8px; }

/* images */
figure.img { margin: 0 0 10px; }
figure.img img { max-width: 100%; height: auto; display: block; border-radius: 4px; }
.statblock figure.img img { mix-blend-mode: multiply; }
figure.img.ext { display: grid; gap: 6px; justify-items: start; }
figure.img.ext a { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: center; padding: 10px 12px; border: 1px dashed currentColor; border-radius: 8px; opacity: .85; text-decoration: none; color: inherit; max-width: 300px; }
figure.img.ext a:hover { opacity: 1; }
figure.img.ext .ico { grid-row: span 2; font-size: 1.4rem; }
figure.img.ext small { font-family: var(--ui); font-size: .75rem; opacity: .75; }
.withimg { display: grid; grid-template-columns: minmax(0, 1fr) minmax(160px, 300px); gap: 16px; align-items: start; margin-bottom: 8px; }
.withimg > p { margin: 0; }

/* creature page: picture beside the core stats, actions below at full width */
.beast { display: grid; grid-template-columns: minmax(240px, 1fr) minmax(300px, 470px); gap: 24px; align-items: start; margin-bottom: 8px; }
.beast .statblock { margin: 0; }
.portrait { display: grid; gap: 8px; justify-items: start; }
.portrait img { border-radius: 8px; border: 1px solid var(--line); }
.portrait.empty { min-height: 260px; place-content: center; justify-items: center; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); font-style: italic; font-family: var(--body); }
.statblock.feats { max-width: none; padding: 16px 22px 18px; }
.statblock.feats .sbfeat > h2:first-child { margin-top: 2px; }

/* magic item page, after the docs style guide */
.itempage { background: #f7f1e3; color: #2a2118; font-family: "EB Garamond", var(--body); font-size: 1.12rem; line-height: 1.5; padding: 28px 34px 26px; border-radius: 6px; max-width: 720px; border-bottom: 3px solid var(--guide-gold); box-shadow: 0 8px 30px rgba(0,0,0,.35); position: relative; }
.itempage .ititle { font-family: var(--display); font-weight: 700; font-size: 2rem; color: var(--sb-red); text-align: center; letter-spacing: .02em; }
.itempage .isub { text-align: center; font-style: italic; color: var(--guide-grey); margin: 4px 0 0; padding-bottom: 8px; border-bottom: 2px solid var(--guide-gold); }
.itempage .isub a { color: var(--sb-red); }
.itempage .irar { text-align: center; margin: 8px 0 0; }
.itempage .iimg { display: grid; justify-items: center; gap: 8px; margin: 22px 0; color: #9a9a9a; font-style: italic; }
.itempage .flavour { margin: 0 0 14px; padding: 2px 0 2px 14px; border-left: 4px solid var(--guide-gold); font-style: italic; text-align: justify; }
.itempage .iprops p { margin: 0 0 10px; text-align: justify; }
.itempage .iprops strong em, .itempage .iprops strong { color: var(--sb-red); }
.itempage .iprops h3, .itempage .iprops h4 { font-family: var(--display); color: var(--sb-red); border-bottom: 1px solid var(--sb-red); font-size: 1.1rem; margin: 14px 0 6px; }
.itempage a { color: var(--sb-red); }

/* rarity glows */
.r-unique { color: var(--unique); text-shadow: 0 0 8px rgba(255,140,40,.8); }
.r-divine { color: var(--divine); text-shadow: 0 0 6px #fff6d0, 0 0 14px rgba(255,226,140,.9); }
.itempage .r-divine { color: #a77d1f; }
.card.rar-unique { border-color: var(--unique); box-shadow: 0 0 0 1px rgba(255,154,60,.6), 0 0 22px rgba(255,130,30,.35); }
.card.rar-unique h2 { color: #ffb36b; text-shadow: 0 0 10px rgba(255,130,30,.6); }
.card.rar-unique::before { background: linear-gradient(180deg, #ffcf6b, var(--unique), #c2410c); }
.card.rar-divine { border-color: #f4e3a6; background: radial-gradient(120% 90% at 50% 0%, rgba(255,244,200,.14), transparent 60%), var(--panel); box-shadow: 0 0 0 1px rgba(255,241,196,.55), 0 0 26px rgba(255,236,170,.35); }
.card.rar-divine h2 { color: #fff6da; text-shadow: 0 0 8px rgba(255,240,190,.9), 0 0 18px rgba(255,214,120,.5); }
.card.rar-divine::before { background: linear-gradient(180deg, #fff, #ffe9a8, #d9b45a); }
.itempage.rar-unique { box-shadow: 0 0 0 2px var(--unique), 0 0 34px rgba(255,130,30,.55), 0 8px 30px rgba(0,0,0,.35); }
/* Unique creatures: the same ember glow as unique items */
.sbunique { border-radius: 10px; box-shadow: 0 0 0 2px var(--unique), 0 0 34px rgba(255,130,30,.55); }
.sbunique .statblock { box-shadow: none; }
.sbunique .sbname { color: #c2410c; text-shadow: 0 0 12px rgba(255,140,40,.75), 0 0 2px rgba(255,190,120,.9); }
h1.uqtitle { color: #ffb36b; text-shadow: 0 0 14px rgba(255,130,30,.6); }
.uqpill { display: inline-block; vertical-align: middle; margin-left: 8px; padding: 2px 10px; border-radius: 999px; font: 700 .72rem var(--ui); letter-spacing: .12em; text-transform: uppercase; color: #1b1408; background: var(--unique); box-shadow: 0 0 12px rgba(255,130,30,.6); text-shadow: none; }
.brow.uniq { box-shadow: inset 3px 0 0 var(--unique); } .brow.uniq .bname { color: #ffb36b; text-shadow: 0 0 8px rgba(255,140,40,.55); }
.uqcheck { display: flex; align-items: center; gap: 9px; margin: 2px 0 8px; } .uqcheck input { width: auto !important; accent-color: var(--unique); }
.itempage.rar-unique .ititle { color: #c2410c; text-shadow: 0 0 12px rgba(255,140,40,.75), 0 0 2px rgba(255,190,120,.9); }
.itempage.rar-divine { background: radial-gradient(90% 50% at 50% 0%, #fffdf3 0%, #fbf3dc 45%, #f7f1e3 100%); box-shadow: 0 0 0 2px #f2dc94, 0 0 40px rgba(255,236,160,.75), 0 0 90px rgba(255,248,214,.35), 0 8px 30px rgba(0,0,0,.35); }
.itempage.rar-divine::before { content: ""; position: absolute; inset: 0; border-radius: 6px; pointer-events: none; background: repeating-conic-gradient(from 0deg at 50% 0%, rgba(255,236,170,.18) 0deg 6deg, transparent 6deg 18deg); mask: radial-gradient(70% 45% at 50% 0%, #000, transparent); -webkit-mask: radial-gradient(70% 45% at 50% 0%, #000, transparent); }
.itempage.rar-divine .ititle { color: #a87a12; text-shadow: 0 0 14px #fff2b0, 0 0 4px #fffbe6; }
@media (prefers-reduced-motion: no-preference) {
  .card.rar-divine, .itempage.rar-divine { animation: divine 4s ease-in-out infinite; }
  .card.rar-unique { animation: ember 3s ease-in-out infinite; }
  .sbunique { animation: ember 3s ease-in-out infinite; }
}
@keyframes divine { 50% { box-shadow: 0 0 0 1px rgba(255,241,196,.8), 0 0 40px rgba(255,236,170,.6); } }
@keyframes ember { 50% { box-shadow: 0 0 0 1px rgba(255,154,60,.9), 0 0 30px rgba(255,120,20,.5); } }

/* handouts: the Tattered Note */
.handout { max-width: 640px; margin: 8px 0 24px; }
.handout .found { text-align: center; font-style: italic; color: var(--muted); font-family: var(--body); margin: 0 0 14px; }
.handout .tnote { filter: drop-shadow(0 10px 18px rgba(0,0,0,.45)); transform: rotate(-.6deg); }
.handout .torn { height: 16px; background: var(--parch); }
.handout .torn.top { clip-path: polygon(0% 100%, 0.0% 45%, 2.1% 69%, 4.2% 70%, 6.2% 43%, 8.3% 68%, 10.4% 13%, 12.5% 40%, 14.6% 18%, 16.7% 89%, 18.8% 21%, 20.8% 76%, 22.9% 95%, 25.0% 61%, 27.1% 98%, 29.2% 91%, 31.2% 36%, 33.3% 43%, 35.4% 38%, 37.5% 47%, 39.6% 62%, 41.7% 59%, 43.8% 59%, 45.8% 39%, 47.9% 29%, 50.0% 63%, 52.1% 38%, 54.2% 64%, 56.2% 37%, 58.3% 80%, 60.4% 32%, 62.5% 69%, 64.6% 89%, 66.7% 54%, 68.8% 98%, 70.8% 62%, 72.9% 78%, 75.0% 67%, 77.1% 14%, 79.2% 85%, 81.2% 62%, 83.3% 55%, 85.4% 73%, 87.5% 73%, 89.6% 51%, 91.7% 96%, 93.8% 53%, 95.8% 39%, 97.9% 73%, 100.0% 100%, 100% 100%); margin-bottom: -1px; }
.handout .torn.bottom { clip-path: polygon(0% 0%, 0.0% 18%, 2.1% 35%, 4.2% 1%, 6.2% 42%, 8.3% 8%, 10.4% 5%, 12.5% 8%, 14.6% 22%, 16.7% 57%, 18.8% 7%, 20.8% 36%, 22.9% 80%, 25.0% 56%, 27.1% 25%, 29.2% 23%, 31.2% 80%, 33.3% 10%, 35.4% 16%, 37.5% 15%, 39.6% 44%, 41.7% 17%, 43.8% 0%, 45.8% 24%, 47.9% 51%, 50.0% 45%, 52.1% 46%, 54.2% 44%, 56.2% 5%, 58.3% 51%, 60.4% 79%, 62.5% 26%, 64.6% 36%, 66.7% 41%, 68.8% 6%, 70.8% 14%, 72.9% 15%, 75.0% 3%, 77.1% 0%, 79.2% 7%, 81.2% 33%, 83.3% 57%, 85.4% 55%, 87.5% 16%, 89.6% 31%, 91.7% 8%, 93.8% 76%, 95.8% 30%, 97.9% 44%, 100.0% 7%, 100% 0%); margin-top: -1px; }
.handout .paper { background: var(--parch); background-image: radial-gradient(60% 40% at 80% 20%, rgba(120,80,30,.12), transparent 70%), radial-gradient(40% 30% at 15% 75%, rgba(120,80,30,.10), transparent 70%); color: var(--parch-ink); font-family: "IM Fell English", Georgia, serif; font-size: 1.15rem; line-height: 1.5; padding: 8px 30px 14px; }
.handout .paper p { margin: 0 0 .7em; }
.handout .paper .entryline { font-family: "IM Fell English SC", "IM Fell English", Georgia, serif; font-size: 1.2rem; }
.handout .paper del { color: #8c7352; text-decoration-thickness: 1.5px; }
.handout .paper .blot { color: #1d130b; letter-spacing: -2px; }
.handout .paper .scrawl { font-family: "Reenie Beanie", cursive; font-size: 1.8rem; line-height: 1.1; color: #800a0a; text-align: right; transform: rotate(-2deg); margin-top: .4em; }
.handout .tornaway { text-align: center; font-style: italic; color: var(--muted); font-size: .92rem; margin: 14px 0 0; }
.card.t-handout { background: linear-gradient(180deg, rgba(232,214,173,.10), transparent 70%), var(--panel); }

/* home */
.home { display: grid; gap: 22px; }
.hero { display: grid; gap: 14px; padding: 8px 0 4px; }
.hero h1 { font-size: clamp(1.8rem, 4vw, 2.8rem); }
.hero h1 span { color: var(--brass); }
.search.big input { font-size: 1.05rem; padding: 12px 14px; max-width: 640px; }
/* Home dashboard: continue first, then party and recent work; reference material on the side */
.home2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.home2 > *, .hmain > *, .hside > * { min-width: 0; }
.hhead { display: grid; gap: 14px; padding-top: 6px; }
.hhtitle { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }
.hhtitle h1 { margin: 0; font-size: clamp(1.7rem, 3.6vw, 2.5rem); }
.hhtitle h1 span { color: var(--brass); }
.hactions { display: flex; gap: 8px; flex-wrap: wrap; }
.hhead .search.big { max-width: 720px; }
.hstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; }
.hstat { position: relative; display: grid; gap: 1px; padding: 12px 14px 11px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; color: var(--text); overflow: hidden; transition: border-color .15s, background .15s; }
.hstat::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--tc, var(--brass)); }
.hstat:hover { text-decoration: none; border-color: color-mix(in srgb, var(--tc, var(--brass)) 55%, var(--line)); background: var(--panel-2); }
.hstat b { font: 700 1.6rem/1.1 var(--display); font-variant-numeric: tabular-nums; }
.hstat span { font: 600 .82rem var(--ui); color: var(--muted); }
.hstat small { font: .74rem var(--ui); color: var(--muted); opacity: .8; }
.hgrid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.hmain, .hside { display: grid; gap: 18px; }
.hcard { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; color: var(--text); }
.hcard > header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.hcard > header h2 { margin: 0; font-size: 1.15rem; }
.hmore { font: 600 .82rem var(--ui); color: var(--muted); white-space: nowrap; }
.hmore:hover { color: var(--brass); text-decoration: none; }
a.hcard:hover { text-decoration: none; border-color: var(--brass-dim); }
.hcont { display: grid; gap: 6px; justify-items: start; padding: 20px 22px; border-radius: 14px; color: var(--text); border: 1px solid var(--brass-dim); background: radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--brass) 16%, var(--panel)) 0%, var(--panel) 60%); transition: border-color .15s; }
.hcont:hover { text-decoration: none; border-color: var(--brass); }

.hcont strong { font: 700 1.7rem/1.15 var(--display); }
.hcmeta { display: flex; gap: 6px 16px; flex-wrap: wrap; color: var(--muted); font-size: .92rem; }
.hcfight { font: 600 .9rem var(--ui); color: var(--bad); }

.hparty, .hrecent, .htodo, .hbooks { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
.hparty li + li, .hrecent li + li, .hbooks li + li { border-top: 1px solid var(--line); }

.hpname { display: grid; min-width: 0; }
.hpimg { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid var(--brass-dim); background: var(--panel-2); }
.hpinit { display: grid; place-items: center; font: 700 1.1rem var(--display); color: var(--brass); }
/* Books lying in a pile: each one a spine you can click */
.hstack { display: flex; flex-direction: column-reverse; align-items: center; gap: 3px; padding: 8px 0 0; border-bottom: 4px solid var(--brass-dim); border-radius: 0 0 2px 2px; }
.hbook { position: relative; display: flex; align-items: center; justify-content: center; height: 30px; width: 88%; padding: 0 22px; border-radius: 3px 5px 5px 3px; color: #1b1408; background: linear-gradient(180deg, var(--brass-dim), var(--brass) 38%, var(--brass-dim)); box-shadow: 0 2px 0 rgba(0,0,0,.35); transition: transform .15s, filter .15s; }
.hbook::before, .hbook::after { content: ""; position: absolute; top: 4px; bottom: 4px; width: 2px; background: rgba(27,20,8,.35); }
.hbook::before { left: 10px; } .hbook::after { right: 10px; }
.hbook span { font: 700 .8rem var(--ui); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbook:hover { text-decoration: none; transform: translateX(6px); filter: brightness(1.12); }
.hbook.hb1 { width: 80%; height: 26px; transform: translateX(-8px); } .hbook.hb1:hover { transform: translateX(-2px); }
.hbook.hb2 { width: 94%; height: 34px; transform: translateX(5px); } .hbook.hb2:hover { transform: translateX(11px); }
.hbook.hb3 { width: 76%; height: 28px; transform: translateX(10px); } .hbook.hb3:hover { transform: translateX(16px); }
.hbook.hb4 { width: 90%; height: 32px; transform: translateX(-4px); } .hbook.hb4:hover { transform: translateX(2px); }
.hbook.st-in-progress { background: linear-gradient(180deg, #3f6f93, var(--c-location) 38%, #3f6f93); }
.hbook.st-planned { background: repeating-linear-gradient(90deg, var(--line) 0 6px, var(--panel-2) 6px 10px); color: var(--muted); }
.hbook.st-planned::before, .hbook.st-planned::after { background: var(--line); }
.hpname > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hpac { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px 10px 16px 16px; border: 1px solid var(--line); background: var(--panel-2); font: 700 1rem/1 var(--ui); }
.hpac small { font: 600 .55rem var(--ui); letter-spacing: .1em; color: var(--muted); margin-top: -8px; }
.hphp { display: grid; gap: 3px; font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }
.hpbar { height: 7px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.hpbar i { display: block; height: 100%; border-radius: inherit; background: #6fbf73; }
.hpbar i.mid { background: #e0b44f; } .hpbar i.low { background: var(--bad); }
.hrecent li { display: grid; grid-template-columns: minmax(0, 1fr) auto 84px; gap: 10px; align-items: center; padding: 8px 2px; }
.hrecent li > a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.hrecent li > .small { text-align: right; }
.htodo { gap: 10px; }
.htodo li { display: flex; gap: 12px; align-items: flex-start; font-size: .93rem; }
.hnum { flex: none; min-width: 2.1em; padding: 2px 6px; border-radius: 8px; text-align: center; font: 700 .9rem var(--ui); background: color-mix(in srgb, var(--brass) 20%, var(--panel-2)); color: var(--brass); }
.hnum.quiet { background: var(--panel-2); color: var(--muted); }
.hlinks { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 2px; font-size: .85rem; }
.hspot { display: grid; gap: 5px; color: var(--text); }
.hspot:hover { text-decoration: none; }
.hspot strong { font: 700 1.3rem var(--display); }
.hspot:hover strong { color: var(--c-creature); }
.hspotcard { border-top: 3px solid var(--c-creature); }
.hbooks li .small { white-space: nowrap; }
.hlinks .linkbtn { padding: 0; margin: 0; text-align: left; font-size: inherit; text-decoration: none; }
.hbooks li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 2px; }
.hbooks li a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hworld .thumb { border-radius: 8px; overflow: hidden; }
@media (max-width: 960px) { .hgrid { grid-template-columns: minmax(0, 1fr); } .hside { order: 0; } }
@media (max-width: 640px) {
  .home2 { gap: 16px; }
  .hactions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; }
  .hactions .btn { padding-left: 6px; padding-right: 6px; }
  .hactions .btn { text-align: center; justify-content: center; }
  .hstats { display: flex; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px; scrollbar-width: none; }
  .hstats::-webkit-scrollbar { display: none; }
  .hstat { flex: 0 0 118px; }
  .hcont { padding: 16px 18px; }
  .hcont strong { font-size: 1.45rem; }
  .hparty a { grid-template-columns: 38px minmax(0, 1fr) auto 84px; gap: 10px; }
  .hpimg { width: 38px; height: 38px; }
  .hrecent li { grid-template-columns: minmax(0, 1fr) auto; }
  .hrecent li > .small { display: none; }
}
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.tile { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 18px 18px 40px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; cursor: pointer; overflow: hidden; min-height: 210px; transition: border-color .15s, transform .15s; }
.tile::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--tc, var(--brass)); }
.tile:hover, .tile:focus-visible { border-color: var(--brass-dim); }
@media (prefers-reduced-motion: no-preference) { .tile:hover { transform: translateY(-2px); } }
.tile.wide { grid-column: span 2; }
.tile header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tile h2 { font-family: var(--display); font-size: 1.35rem; }
.tsub { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
.topen { position: absolute; right: 16px; bottom: 12px; font: 600 .82rem var(--ui); color: var(--brass); }
.tmini { font: 700 .7rem var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 4px 0 -4px; }
.mini { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.mini li { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.mini li a { font-weight: 600; }
.mini li .muted { font-size: .8rem; white-space: nowrap; }
.spot { display: grid; gap: 6px; padding: 14px 16px; border-radius: 10px; background: linear-gradient(135deg, color-mix(in srgb, var(--c-creature) 14%, transparent), transparent 70%); border: 1px solid color-mix(in srgb, var(--c-creature) 30%, transparent); color: var(--text); }
.spot:hover { text-decoration: none; border-color: var(--c-creature); }
.spot .eyebrow { font: 700 .68rem var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--c-creature); }
.spot strong { font-family: var(--display); font-size: 1.6rem; }
.spotstats { display: flex; gap: 16px; font-variant-numeric: tabular-nums; }
.spotstats b { color: var(--c-creature); font-family: var(--ui); font-size: .78rem; margin-right: 3px; }
.spotlore { font-family: var(--body); color: var(--muted); }
.thumb .mapwrap { border-radius: 8px; }
.thumb .dot { pointer-events: none; }
.spines { display: flex; align-items: flex-end; gap: 4px; height: 120px; padding-top: 6px; border-bottom: 3px solid var(--brass-dim); }
.spine { flex: 1 1 0; min-width: 14px; max-width: 34px; height: 100%; border-radius: 3px 3px 0 0; background: linear-gradient(90deg, var(--brass-dim), var(--brass) 40%, var(--brass-dim)); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.spine:nth-child(3n) { height: 88%; } .spine:nth-child(4n+1) { height: 94%; } .spine:nth-child(5n+2) { height: 80%; }
.spine.st-in-progress { background: linear-gradient(90deg, #3f6f93, var(--c-location) 40%, #3f6f93); }
.spine.st-planned { background: repeating-linear-gradient(180deg, var(--line) 0 6px, var(--panel-2) 6px 10px); }
.spine span { writing-mode: vertical-rl; transform: rotate(180deg); font: 600 .62rem var(--ui); color: #1b1408; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-height: 92%; }
.spine.st-planned span { color: var(--muted); }
.spine:hover { filter: brightness(1.15); text-decoration: none; }
.chips2 { display: flex; flex-wrap: wrap; gap: 6px; }
.cloud { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
body.at-home .topsearch, body.at-home .searchtog, body.at-home .topnew { display: none !important; }
.tile .btn { align-self: flex-start; }

/* stat block editor */
.detgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px 10px; }
.sbsections { display: grid; gap: 12px; }
.sbsec { border: 1px solid var(--line); border-left: 3px solid var(--sb-red); border-radius: 8px; padding: 10px; display: grid; gap: 8px; background: color-mix(in srgb, var(--bg) 60%, var(--panel)); }
.sbsechead { display: flex; gap: 6px; align-items: center; }
.sbsechead .secname { font-family: var(--display); font-weight: 700; font-size: 1.05rem; color: #e9b7a8; background: transparent; border-color: transparent; padding: 4px 6px; }
.sbsechead .secname:hover, .sbsechead .secname:focus { border-color: var(--line); }
.sbitem { display: grid; gap: 4px; padding: 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }

.itdesc { font-size: 1rem; }
.iconbtn { flex: 0 0 auto; min-width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; font: 600 .85rem var(--ui); padding: 0 8px; }
.iconbtn:hover:not(:disabled) { color: var(--text); border-color: var(--brass-dim); }
.iconbtn:disabled { opacity: .35; cursor: default; }

.addit { justify-self: start; }
.addsec { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.addsec select { width: auto; }

/* rich text */
.field { display: grid; gap: 4px; }
.flabel { display: block; font-weight: 600; }
.rt { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); overflow: hidden; }
.rt:focus-within { border-color: var(--brass-dim); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brass) 20%, transparent); }
.rtbar { display: flex; flex-wrap: wrap; gap: 2px; padding: 4px; border-bottom: 1px solid var(--line); background: var(--panel); }
.rtbtn { font: 500 .85rem var(--ui); color: var(--text); background: transparent; border: 1px solid transparent; border-radius: 5px; padding: 3px 9px; cursor: pointer; min-width: 30px; }
.rtbtn:hover { background: var(--panel-2); border-color: var(--line); }
.rtbtn.rtmd { margin-left: auto; color: var(--muted); font-size: .78rem; }
.rtbtn.on { background: var(--panel-2); color: var(--text); border-color: var(--brass-dim); }
.rtbar.raw .rtbtn:not(.rtmd) { opacity: .35; pointer-events: none; }
.rtedit { padding: 10px 12px; font-size: 1.05rem; outline: none; max-width: none; overflow-wrap: anywhere; }
.rtedit p { margin: 0 0 .6em; }
.rtedit.is-empty::before { content: attr(data-placeholder); color: var(--muted); pointer-events: none; float: left; height: 0; }
.rtedit .wiki { color: var(--brass); border-bottom: 1px dotted var(--brass-dim); }
.rtedit .mdblock { margin: 8px 0; padding: 6px; border: 1px dashed var(--line); border-radius: 6px; opacity: .85; user-select: none; max-height: 220px; overflow: hidden; position: relative; }
.rtedit .mdblock .statblock { transform: scale(.9); transform-origin: top left; }
.mdtag { display: inline-block; font: 600 .7rem var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.rt .rtsource { border: 0; border-radius: 0; font-family: ui-monospace, monospace; font-size: .88rem; }
.rtlink { display: flex; gap: 6px; padding: 6px; border-bottom: 1px solid var(--line); background: var(--panel); }
.rtlink[hidden] { display: none; }
.rt.small .rtedit { font-size: 1rem; padding: 8px 10px; }
.sbitem .rt { background: var(--bg); }

/* item editor */
.propchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 34px; }
.propchip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 10px; border: 1px solid var(--brass-dim); border-radius: 999px; background: var(--panel-2); font-weight: 600; font-size: .9rem; }
.propchip .propparam { width: 110px; padding: 3px 7px; font-size: .85rem; border-radius: 999px; }
.propchip .iconbtn { height: 26px; min-width: 26px; border-radius: 999px; padding: 0; }
.propadd { display: flex; gap: 6px; align-items: center; }
.propadd select { width: auto; }
label.check.inline { align-self: end; padding-bottom: 8px; }
.itline { margin: 0; padding: 8px 10px; background: var(--sb-paper); color: var(--sb-ink); border-radius: 6px; font-family: "EB Garamond", var(--body); }
.itline .muted { color: #7b6a55; font-style: normal; }
.sbsec.plain { border-left-color: var(--guide-gold); }
.itempage .flavour p { margin: 0 0 .5em; }
.statpanel { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-left: 3px solid var(--guide-gold); border-radius: 8px; }
.statpanel[hidden] { display: none; }
.usepanel { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-left: 3px solid #c48ad8; border-radius: 8px; }
.usepanel p { margin: 0; }
.itempage .btn.ghost { color: var(--sb-red); border-color: var(--guide-gold); background: rgba(255,255,255,.35); }
.itempage .btn.ghost:hover { background: rgba(255,255,255,.7); }
.itempage .istats { display: flex; flex-wrap: wrap; gap: 8px 28px; justify-content: center; margin: 4px 0 14px; padding: 10px 0; border-top: 1.5px solid var(--guide-gold); border-bottom: 1.5px solid var(--guide-gold); }
.itempage .istats div { display: grid; justify-items: center; gap: 1px; }
.itempage .istats > div > span { font: 700 .68rem var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--sb-red); }
.itempage .istats strong { font-family: "EB Garamond", var(--body); font-size: 1.15rem; font-weight: 600; color: #2a2118; }
.istatshort { margin: 0 !important; font: 600 .85rem var(--ui) !important; color: var(--text) !important; flex: 0 !important; }
.itempage .wprops { margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--guide-gold); }
.itempage .wprops h3 { font-family: var(--display); color: var(--sb-red); font-size: 1.05rem; margin: 0 0 6px; }
.itempage .wprops p { margin: 0 0 8px; text-align: justify; }
.itempage .wprops strong, .itempage .wprops em { color: var(--sb-red); }

/* attack builder */
.seg.small button { padding: 3px 10px; font-size: .78rem; }
.sbitem > .seg { justify-self: start; margin: 2px 0; }
.atk { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.atk .wide { grid-column: 1 / -1; }
.atk > label:first-child { grid-column: span 2; }
.atk label span { font-size: .78rem; }
.avgnote { display: block; color: var(--brass); font-size: .75rem; margin-top: 3px; font-variant-numeric: tabular-nums; }
.atkprev { margin: 2px 0 0; padding: 8px 10px; background: var(--sb-paper); color: var(--sb-ink); border-radius: 6px; font-family: var(--body); font-size: .98rem; }
.atkprev .muted { color: #7b6a55; }
/* dice averages */
.dice { position: relative; border-bottom: 1px dotted currentColor; cursor: help; white-space: nowrap; }
.dice:hover::after, .dice:focus::after { content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); white-space: pre; background: #0d0f14; color: #f1e7cf; border: 1px solid var(--brass-dim); border-radius: 6px; padding: 5px 9px; font: 500 .8rem/1.35 var(--ui); font-style: normal; z-index: 30; box-shadow: 0 6px 18px rgba(0,0,0,.45); pointer-events: none; }
.dice:focus { outline: none; background: color-mix(in srgb, var(--brass) 18%, transparent); border-radius: 2px; }

/* tag picker */
.btools .filterpop .pop { width: min(560px, calc(100vw - 32px)); max-height: min(70vh, 640px); padding: 12px; }
.tpick .tpempty { display: block; margin: 0; }
.tpick .tpempty[hidden] { display: none; }
.tpick { display: grid; gap: 10px; }
.tagq { font-size: .95rem; }
.tpsel { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.tplabel { font: 700 .66rem var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.linkbtn { all: unset; cursor: pointer; color: var(--brass); font-size: .85rem; margin-left: auto; }
.linkbtn:focus-visible { outline: 2px solid var(--brass); }
.tpgroups { display: grid; gap: 6px; }
.tpgroup { border: 1px solid var(--line); border-radius: 8px; background: color-mix(in srgb, var(--bg) 50%, var(--panel)); }
.tpgroup > summary { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; cursor: pointer; font-weight: 600; list-style: none; }
.tpgroup > summary::-webkit-details-marker { display: none; }
.tpgroup > summary::before { content: "▸"; color: var(--muted); margin-right: 8px; transition: transform .15s; }
.tpgroup[open] > summary::before { transform: rotate(90deg); }
.tpgroup > summary > span:first-of-type { flex: 1; }
.tpgroup.flat { padding: 8px 10px; }
.tpchips { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 10px 10px; }
.tpgroup.flat .tpchips { padding: 6px 0 0; }
.pchip { display: inline-flex; align-items: center; gap: 6px; font: 500 .85rem var(--ui); color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.pchip span { color: var(--muted); font-size: .75rem; font-variant-numeric: tabular-nums; }
.pchip:hover { border-color: var(--brass-dim); }
.pchip.on { background: color-mix(in srgb, var(--brass) 22%, var(--panel-2)); border-color: var(--brass); }
.pchip.all { font-weight: 700; }
.pchip[hidden], .tpgroup[hidden] { display: none; }
@media (max-width: 700px) {
  .btools .filterpop .pop { position: fixed; left: 12px; right: 12px; top: auto; bottom: 12px; width: auto; max-height: 72vh; z-index: 40; }
}

/* magic item filters */
.segrow { display: flex; flex-wrap: wrap; gap: 10px; }
.kindseg { align-self: start; }
.rar.mundane { color: var(--muted); }
.magicbox { color: var(--c-item); }
.magiconly[hidden] { display: none !important; }
.kindseg button { padding: 6px 14px; font-size: .9rem; }
.kindseg span { color: var(--muted); font-size: .78rem; margin-left: 3px; }
.itemfilters { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.rarsel { display: flex; gap: 8px; align-items: center; }
.rarsel span { font: 700 .7rem var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.rarsel select { width: auto; min-width: 170px; }

/* bestiary */
.btools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btools .search { flex: 1 1 220px; max-width: 360px; }
.btools .bsort select { width: auto; }
.filterpop { position: relative; }
.filterpop > summary { list-style: none; }
.filterpop > summary::-webkit-details-marker { display: none; }
.filterpop .pop { position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; width: min(340px, 86vw); max-height: 60vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; box-shadow: 0 14px 40px rgba(0,0,0,.5); }
.bview { display: grid; grid-template-columns: 1fr; gap: 20px; align-items: start; }
.blist { display: grid; gap: 6px; }
.brow { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--c-creature); border-radius: 8px; color: var(--text); }
.brow:hover { text-decoration: none; border-color: var(--brass-dim); border-left-color: var(--c-creature); }
.brow.nosb { border-left-color: var(--line); }
.bmain { display: grid; gap: 1px; min-width: 0; }

/* ----- Full-page book editor ----- */

.befoot { display: flex; align-items: flex-start; gap: 12px; margin-top: 12px; }
.rtedit .mdblock.embedblock { max-height: none; opacity: 1; overflow: visible; border: 1px solid color-mix(in srgb, var(--tc, var(--brass)) 55%, var(--line)); border-left: 4px solid var(--tc, var(--brass)); background: var(--panel); padding: 0; margin: 14px 0; font-size: 1rem; }
.embbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 7px 10px; border-bottom: 1px solid var(--line); font-family: var(--ui); }

.beplist { display: flex; flex-direction: column; gap: 4px; max-height: 50vh; overflow: auto; margin: 10px 0; }
.bepick { display: flex; align-items: center; gap: 8px; text-align: left; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; font: inherit; }
.bepick:hover, .bepick:focus-visible { border-color: var(--brass); }
/* Embedded entries inside a book */

.embed { border-top: 2px solid color-mix(in srgb, var(--tc, var(--brass)) 70%, transparent); padding-top: 10px; }

/* Subclasses and races */

.clsbasics { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 6px 22px; margin: 6px 0 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }

.ho-live .paper input::placeholder { color: rgba(60,40,20,.45); }
.ho-live .rt { background: transparent; border: 0; }
.ho-live .rtbar { background: rgba(60,40,20,.08); border: 0; border-radius: 6px; }
.ho-live .rtbar .rtbtn { color: var(--parch-ink); }
.ho-live .rtedit { color: var(--parch-ink); font-family: "IM Fell English", Georgia, serif; font-size: 1.15rem; line-height: 1.5; padding: 8px 0; min-height: 10em; }
.ho-live .rtedit.is-empty::before { color: rgba(60,40,20,.45); }
.ho-live .rt .rtsource { background: rgba(255,255,255,.4); color: #222; }

/* Book editor: side panel with contents and spelling */
.bebody { display: block; }
.beside { display: none; }
.bsclose, .bsnarrow { display: none; }
@media (min-width: 1280px) {
  .bookeditor { max-width: 1260px; }

  .beside { display: block; position: sticky; top: calc(var(--tophd, 64px) + 10px); max-height: calc(100vh - var(--tophd, 64px) - 24px); overflow: auto; font-size: .92rem; }
}

.bstabs { display: flex; gap: 4px; margin-bottom: 8px; position: sticky; top: 0; background: var(--bg); padding: 2px 0 6px; z-index: 1; }

.rtedit .flash { outline: 2px solid var(--brass); outline-offset: 4px; border-radius: 4px; transition: outline-color 1s; }
.bookeditor .rtedit > * { scroll-margin-top: calc(var(--tophd, 64px) + 90px); }
.bslist { list-style: none; margin: 8px 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.bslist li { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--panel); }
.bsw { display: flex; align-items: baseline; gap: 6px; }
.bsword { background: none; border: 0; padding: 0; font: 600 .95rem var(--ui); color: #e07a6a; text-decoration: underline wavy #e07a6a; cursor: pointer; }
.bsacts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.bssug { font: .82rem var(--ui); background: var(--bg); color: var(--text); border: 1px solid var(--brass-dim); border-radius: 99px; padding: 2px 9px; cursor: pointer; }
.bssug:hover { border-color: var(--brass); color: var(--brass); }
.bsmini { font: .74rem var(--ui); background: none; border: 0; color: var(--muted); cursor: pointer; padding: 2px 4px; text-decoration: underline; }
.bsok { color: #6fbf73; }
/* Editable tables */
.rtedit table.rttable { border-collapse: collapse; margin: 10px 0; min-width: 40%; }
.rtedit table.rttable td { border: 1px solid var(--line); padding: 5px 9px; min-width: 60px; vertical-align: top; }
.rtedit table.rttable tr:first-child td { background: var(--panel); font-weight: 600; }
.rttbar { display: flex; flex-wrap: wrap; gap: 3px; padding: 4px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--brass) 12%, var(--panel)); }
.rttbar[hidden] { display: none; }
.rttbar button { font: .76rem var(--ui); background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 2px 7px; cursor: pointer; }
.bookeditor .rttbar { position: sticky; top: calc(var(--tophd, 64px) + 44px); z-index: 5; }

.spimport textarea { width: 100%; margin: 8px 0; font: .9rem ui-monospace, monospace; }

/* Harvest / loot tables */
.loot { margin: 14px 0 18px; }
.loottitle { font: 600 .78rem var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--brass); margin: 0 0 8px; }
.lootgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.lootitem { background: var(--parch); color: var(--parch-ink); border-radius: 10px; padding: 12px 12px 10px; box-shadow: 0 6px 16px rgba(0,0,0,.35); border: 1px solid rgba(90,60,25,.35); text-align: center; }

.lootimg img { width: 100%; height: 100%; object-fit: cover; }

.lootstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 0; border-top: 1px solid rgba(90,60,25,.3); padding-top: 6px; }
.lootstats div { display: flex; flex-direction: column; }
.lootstats dt { font: 600 .58rem var(--ui); letter-spacing: .08em; text-transform: uppercase; color: rgba(60,40,20,.7); }

.lootrowhead, .lootrow { display: grid; grid-template-columns: 1.8fr .6fr 1fr 1.1fr 1.6fr auto auto auto; gap: 6px; align-items: start; }
.ltcell { display: flex; flex-direction: column; min-width: 0; } .ltcell small { font: .72rem var(--ui); color: var(--brass); min-height: 1em; padding: 2px 2px 0; }
.sizecfg { margin: 4px 0 10px; } .sizecfg summary { cursor: pointer; font: 600 .85rem var(--ui); color: var(--brass); } .sizecfg input.mini { width: 60px; }
.lootrowhead { font: 600 .7rem var(--ui); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 6px 0 2px; }
.lootrow { margin-bottom: 6px; }
.lootrow input { min-width: 0; }
@media (max-width: 640px) { .lootrowhead { display: none; } .lootrow { grid-template-columns: 1fr 1fr 1fr; } .lootrow .lt-n, .lootrow .lt-img { grid-column: 1 / -1; } }

.islot.harvest { background: var(--parch) !important; color: var(--parch-ink) !important; border-color: rgba(90,60,25,.45) !important; }

.islot.harvest .iico { color: rgba(90,60,25,.6); }

.pschip { display: inline-flex; align-items: center; gap: 6px; background: var(--parch); color: var(--parch-ink); border: 1px solid rgba(90,60,25,.4); border-radius: 8px; padding: 4px 8px; cursor: grab; user-select: none; font-size: .9rem; }
